# USER DB
apiVersion: v1
kind: Service
metadata:
  name: user-db
spec:
  ports:
    - port: 3306
  selector:
    app: user-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-db
spec:
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "rootpassword"
            - name: MYSQL_DATABASE
              value: "user_db"
          ports:
            - containerPort: 3306

---
# DATA DB
apiVersion: v1
kind: Service
metadata:
  name: data-db
spec:
  ports:
    - port: 3306
  selector:
    app: data-db
