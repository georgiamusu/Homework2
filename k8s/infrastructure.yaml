---
# KAFKA
apiVersion: v1
kind: Service
metadata:
  name: my-kafka
spec:
  ports:
    - port: 9092
      name: plain
  selector:
    app: kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.4.0
          # Limiti memoria per evitare crash su Mac
          resources:
            limits:
              memory: "1Gi"
            requests:
              memory: "512Mi"
          env:
            # ID Cluster statico
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            - name: KAFKA_CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"

            # Configurazione KRaft
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"

            # <--- CAMBIATO QUI: Punta a 'my-kafka' invece di 'kafka'
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://my-kafka:9092"

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512M -Xms512M"
            - name: KAFKA_LOG_DIRS
              value: "/tmp/kafka-logs"
          ports:
            - containerPort: 9092